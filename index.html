<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Hub Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #2d333b;
    --text: #e6edf3; --dim: #8b949e;
    --up: #3fb950; --down: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 20px 24px 8px;
  }
  h1 { font-size: 20px; margin: 0; }
  #summary { color: var(--dim); }
  #updated { color: var(--dim); font-size: 13px; margin-left: auto; }
  #banner { margin: 0 24px; padding: 8px 12px; border-radius: 8px; display: none; }
  #banner.err { display: block; background: #3d1a1a; color: #ffa198; }
  main {
    display: grid; gap: 14px; padding: 16px 24px 32px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .up .dot { background: var(--up); box-shadow: 0 0 8px var(--up); }
  .down .dot { background: var(--down); box-shadow: 0 0 8px var(--down); }
  .name { font-weight: 600; }
  .state { margin-left: auto; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  .up .state { color: var(--up); }
  .down .state { color: var(--down); }
  .url { color: var(--dim); font-size: 12.5px; margin-top: 4px; word-break: break-all; }
  .metrics { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
  .ms { font-variant-numeric: tabular-nums; font-size: 14px; }
  .ms.fast { color: var(--up); } .ms.mid { color: var(--warn); } .ms.slow { color: var(--down); }
  .code { color: var(--dim); font-size: 12.5px; }
  .spark { margin-left: auto; opacity: .9; }
  .note { color: var(--warn); font-size: 12px; margin-top: 8px; }
  .err { color: #ffa198; font-size: 12px; margin-top: 6px; word-break: break-all; }
  footer { padding: 0 24px 24px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>MCP Hub Dashboard</h1>
  <span id="summary">connecting…</span>
  <span id="updated"></span>
</header>
<div id="banner"></div>
<main id="grid"></main>
<footer>auto-refreshing · latency history is kept client-side since page load</footer>
<script>
const history = {};          // name -> [{up, ms}]
let refreshMs = 10000;
let timer = null;

function sparkline(samples) {
  if (samples.length < 2) return "";
  const w = 90, h = 24, max = Math.max(50, ...samples.map(s => s.ms || 0));
  const pts = samples.slice(-30).map((s, i, a) => {
    const x = (i / (a.length - 1)) * w;
    const y = s.ms ? h - (s.ms / max) * (h - 3) - 1.5 : h - 1;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const dots = samples.slice(-30).map((s, i, a) =>
    s.ms ? "" : `<circle cx="${((i / (a.length - 1)) * w).toFixed(1)}" cy="${h - 1}" r="1.8" fill="var(--down)"/>`
  ).join("");
  return `<svg class="spark" width="${w}" height="${h}">
    <polyline points="${pts}" fill="none" stroke="var(--up)" stroke-width="1.5"/>${dots}</svg>`;
}

function msClass(ms) { return ms < 150 ? "fast" : ms < 500 ? "mid" : "slow"; }

function render(data) {
  document.getElementById("summary").textContent =
    `${data.summary.up}/${data.summary.total} up`;
  document.getElementById("updated").textContent =
    "checked " + new Date().toLocaleTimeString();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const ep of data.endpoints) {
    (history[ep.name] ||= []).push({ up: ep.up, ms: ep.latency_ms });
    if (history[ep.name].length > 200) history[ep.name].shift();
    const card = document.createElement("div");
    card.className = "card " + (ep.up ? "up" : "down");
    const ms = ep.latency_ms != null
      ? `<span class="ms ${msClass(ep.latency_ms)}">${ep.latency_ms} ms</span>`
      : `<span class="ms">—</span>`;
    const code = ep.status_code ? `<span class="code">HTTP ${ep.status_code}</span>` : "";
    const err = ep.error ? `<div class="err">${ep.error}</div>` : "";
    const note = ep.note ? `<div class="note">⚠ ${ep.note}</div>` : "";
    card.innerHTML = `
      <div class="top"><span class="dot"></span><span class="name"></span>
        <span class="state">${ep.up ? "UP" : "DOWN"}</span></div>
      <div class="url"></div>
      <div class="metrics">${ms}${code}${sparkline(history[ep.name])}</div>
      ${err}${note}`;
    card.querySelector(".name").textContent = ep.name;
    card.querySelector(".url").textContent = ep.url + (ep.kind === "tcp" ? "  (tcp)" : "");
    grid.appendChild(card);
  }
}

async function tick() {
  try {
    const res = await fetch("/status", { cache: "no-store" });
    const data = await res.json();
    render(data);
    document.getElementById("banner").className = "";
    if (data.refresh_seconds && data.refresh_seconds * 1000 !== refreshMs) {
      refreshMs = data.refresh_seconds * 1000;
      clearInterval(timer);
      timer = setInterval(tick, refreshMs);
    }
  } catch (e) {
    const b = document.getElementById("banner");
    b.className = "err";
    b.textContent = "probe server unreachable — is probe.py running? (" + e + ")";
  }
}
tick();
timer = setInterval(tick, refreshMs);
</script>
</body>
</html>
